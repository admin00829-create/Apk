name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name suhbatdosh_ai --org uz.suhbatdosh .
      - run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          add='<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.BLUETOOTH"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>'
          s=s.replace('<application',add+'<application',1)
          s=s.replace('android:label="suhbatdosh_ai"','android:label="SUHBATDOSH AI"')
          open(p,'w').write(s)
          PY
      - run: flutter pub get
      - if: hashFiles('logo.png') != ''
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: suhbatdosh-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
